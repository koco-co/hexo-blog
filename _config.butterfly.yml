# --------------------------------------
# Hexo Butterfly Theme Configuration
# If you have any questions, please refer to the documentation
# Chinese: https://butterfly.js.org/
# English: https://butterfly.js.org/en/
# --------------------------------------

# 官方配置注解文档: https://butterfly.js.org/posts/4aa8abbe/
# --------------------------------------
# 导航栏设置
# 说明：控制站点顶部导航栏的 logo、标题显示与是否固定等。
# 示例：display_title: true （显示站点标题）; fixed: false（不固定在顶部）
# --------------------------------------

nav:
  # 导航栏 Logo（留空则使用站点标题）
  logo:
  # 是否显示站点标题
  display_title: true
  # 是否在文章页面显示标题
  display_post_title: true
  # 导航栏是否固定在顶部（滚动时保持可见）
  fixed: false

# 导航菜单设置
# 说明：配置顶部导航栏的菜单项，格式为 名称: 路径 || 图标
menu:
  主页: / || fas fa-home
  文章 || fas fa-book || hide:
    分类: /categories/ || fas fa-folder-open
    标签: /tags/ || fas fa-tags
    归档: /archives/ || fas fa-archive
  复习: /learn-topic/ || fas fa-graduation-cap
  视频: /video/ || fas fa-video
  #  音乐: /music/ || fas fa-music
  照片: /wallpaper/ || fas fa-image
  友链: /link/ || fas fa-link
  #  留言板: /comments/ || fas fa-comments
  关于: /about/ || fas fa-heart

#menu:
#  主页: / || icon-shouye1 || faa-tada
#  #  文章 || icon-shubenkanshushujishu || faa-tada || hide:
#  分类: /categories/ || icon-wenjianjia || faa-tada
#  标签: /tags/ || icon-biaoqian || faa-tada
#  时间轴: /archives/ || icon-shijianzhou || faa-tada
#  音乐: /music/ || icon-yinle || faa-tada
#  友链: /link/ || icon-youlianguanli || faa-tada
#  关于: /about/ || icon-guanyu1 || faa-tada

# 信笺样式留言板
# see https://akilar.top/posts/e2d3c450/
envelope_comment:
  enable: false #控制开关
  custom_pic:
    cover: /img/violet.png #信笺头部图片
    line: /img/line.png #信笺底部图片
    beforeimg: /img/before.png # 信封前半部分
    afterimg: /img/after.png # 信封后半部分
  message: #信笺正文，多行文本，写法如下
    - 有什么想问的？
    - 有什么想说的？
    - 有什么想吐槽的？
    - 哪怕是有什么想吃的，都可以告诉我哦~
  bottom: 自动书记人偶竭诚为您服务！ #仅支持单行文本
  height: #1050px，信封划出的高度
  path: comments #【可选】comments 的路径名称。默认为 comments，生成的页面为 comments/index.html
  front_matter: #【可选】comments页面的 front_matter 配置
    title: 留言板
    comments: true

# --------------------------------------
# 代码块设置（code_blocks）
# 说明：配置代码块主题、复制按钮、折叠行为和高度限制等。建议保留 copy: true。
# 常用 theme: darker / pale night / light / ocean
# --------------------------------------

code_blocks:
  # Code block theme: darker / pale night / light / ocean / false
  theme: darker
  macStyle: true
  # Code block height limit (unit: px)
  height_limit: 300
  word_wrap: false

  # Toolbar
  copy: true
  language: true
  # true: shrink the code blocks | false: expand the code blocks | none: expand code blocks and hide the button
  shrink: false
  fullpage: false

# 主页卡片样式
# Docs: https://akilar.top/posts/d6b69c49/
#index_card_style: slidecard # slidecard | multicard

# 社交链接设置
# 说明：配置社交媒体的图标链接，格式为 图标: 链接 || 描述 || 颜色
# 常用图标：fab fa-github（GitHub）、fas fa-envelope（邮箱）、fab fa-weibo（微博）、fab fa-qq（QQ）等
#social:
#  fab fa-github: https://github.com/koco-co || GitHub || '#24292e'
#  fas fa-envelope: mailto:kopohub@gmail.com || 邮箱 || '#4a7dbe'
social:
  fas fa-envelope: mailto:kopohub@gmail.com || Email
  fab fa-tiktok: https://v.douyin.com/uk6DHVS-OrI || TikTok
  fas fa-tv: https://space.bilibili.com/3546823172033014 || Bilibili
  fab fa-x-twitter: https://x.com/SugerQvQ || X
  fab fa-steam: https://steamcommunity.com/profiles/76561199483116375/ || Steam
  #  Telegram: https://t.me/sugerovo || icon-telegram || faa-tada

  # GitHub: https://github.com/koco-co || icon-Githubzhanghao || faa-tada
  # QQ: https://res.abeim.cn/api/qq/?qq=1174008660 || icon-QQ || faa-tada
  # 力扣: https://leetcode.cn/u/fomalhaut1998 || icon-likou || faa-tada

# --------------------------------------
# 图片设置
# 说明：所有图片均可使用网络链接，建议使用CDN加速的图片链接
# --------------------------------------

# 网站图标（浏览器标签页图标）
favicon: /img/favicon.ico

# 头像设置
# img: 头像图片链接
# effect: 是否启用头像特效（旋转等）
avatar:
  img: /img/sisyphus-vale-avatar.png
  effect: false

# 是否禁用所有横幅图片
disable_top_img: false

# 默认横幅图片（当页面未设置横幅时使用）
default_top_img:

# 首页横幅图片
index_img:

# 归档页横幅图片
archive_img:

# 标签页横幅图片（单个标签页，非标签列表页）
tag_img:

# 每个标签的专属横幅图片（可选）
# 格式：使用对象格式，键名为标签名，值为图片链接
tag_per_img:
  技术:
  生活:

# 分类页横幅图片（单个分类页，非分类列表页）
category_img:

# 每个分类的专属横幅图片（可选）
# 格式：使用对象格式，键名为分类名，值为图片链接
category_per_img:
  技术总结:
  生活随笔:

# 页脚背景图片
footer_img:

# 网站背景图片
# 可以设置为单个图片URL，或包含多个图片URL的数组（随机选择）
background: /img/background.jpg

# 文章封面图片设置
cover:
  # 是否在首页显示文章封面
  index_enable: true
  # 是否在侧边栏显示文章封面
  aside_enable: true
  # 是否在归档页显示文章封面
  archives_enable: true
  # 默认封面图片（当文章未设置封面时使用）
  # 可以设置多个图片链接，系统会随机选择
  default_cover:
    - /img/picgo-images/文章随机封面01.webp
    - /img/picgo-images/文章随机封面02.webp
    - /img/picgo-images/文章随机封面03.webp
    - /img/picgo-images/文章随机封面04.webp
    - /img/picgo-images/文章随机封面05.webp
    - /img/picgo-images/文章随机封面06.webp
    - /img/picgo-images/文章随机封面07.webp
    - /img/picgo-images/文章随机封面08.webp
    - /img/picgo-images/文章随机封面09.webp
    - /img/picgo-images/文章随机封面10.webp
    - /img/picgo-images/文章随机封面11.webp
    - /img/picgo-images/文章随机封面12.webp
    - /img/picgo-images/文章随机封面13.webp
    - /img/picgo-images/文章随机封面14.webp

# 替换损坏的图片
# 说明：当图片加载失败时显示的替代图片
error_img:
  # 友链页面404图片（留空或设置为false表示不使用）
  flink: /img/friend_404.gif
  # 文章页面404图片
  post_page: /img/404.jpg

# 404错误页面设置
error_404:
  # 是否启用404页面
  enable: true
  # 404页面副标题
  subtitle: "页面未找到"
  # 404页面背景图片
  background: /img/error-page.png

# --------------------------------------
# 文章元信息与目录（post_meta / toc）
# 说明：控制文章或页面显示的日期类型、分类、标签与目录（TOC）行为。
# 示例：post_meta.post.date_type: both（同时显示创建时间和更新时间）
# --------------------------------------

post_meta:
  # Home Page
  page:
    # Choose: created / updated / both
    date_type: both
    # Choose: date / relative
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    # Choose: left / center
    position: left
    # Choose: created / updated / both
    date_type: both
    # Choose: date / relative
    date_format: date
    categories: true
    tags: true
    label: true

toc:
  post: true
  page: false
  number: true
  expand: false
  # Only for post
  style_simple: false
  scroll_percent: true

# --------------------------------------
# 首页设置, Index page settings
# --------------------------------------

# The top_img settings of home page
# default: top img - full screen, site info - middle
# The position of site info, eg: 300px/300em/300rem/10%
index_site_info_top:
# The height of top_img, eg: 300px/300em/300rem
index_top_img_height:

# 首页副标题设置
subtitle:
  # 是否启用副标题
  enable: true
  # 是否启用打字机效果
  effect: true
  # 自定义打字机效果配置
  # 参考：https://github.com/mattboldt/typed.js/#customization
  typed_option:
  # 副标题来源 - 调用第三方API服务（仅中文）
  # 选择：false/1/2/3
  # false - 禁用此功能
  # 1 - hitokoto.cn（一言）
  # 2 - https://api.aa1.cn/doc/yiyan.html（一言API）
  # 3 - jinrishici.com（今日诗词）
  source: false
  # 使用本地固定文案，避免首页加载时调用第三方语录 API。
  sub: 记录技术实践、系统学习与日常思考

# ======================================
# 首页文章卡片布局方式（index_layout）
# ======================================
# 1：封面在左，文章信息在右
# 2：封面在右，文章信息在左
# 3：封面与文章信息左右交替显示
# 4：封面在上，文章信息在下
# 5：文章信息直接显示在封面图上
# 6：瀑布流布局 - 封面在上，信息在下
# 7：瀑布流布局 - 信息直接显示在封面图上
# ======================================

index_layout: 3

# ======================================
# 首页文章简介显示规则（index_post_content）
# ======================================
# method 说明：
# 1：仅显示文章 front-matter 中的 description 字段
#    - 若文章未配置 description，则首页不显示任何简介
#
# 2：优先显示 description
#    - 若存在 description，则显示 description
#    - 若不存在，则从正文中自动截取指定长度作为简介
#
# 3：始终从正文中自动截取摘要作为简介(默认)
#
# length 说明：
# - 当 method 为 2 或 3 时必须配置
# - 控制从正文中截取的字符长度
# ======================================

index_post_content:
  method: 2
  length: 200

# --------------------------------------
# 帖子设置, Post Settings
# --------------------------------------

post_copyright:
  enable: true
  decode: true
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 赞助/奖励, Sponsor/reward
reward:
  enable: true
  text:
  QR_code:
    - img: /img/wechat.jpeg
      link:
      text:
    - img: /img/alipay.jpeg
      link:
      text:

# 帖子编辑, Post edit
# Easily browse and edit blog source code online.
post_edit:
  enable: true
  # url: https://github.com/user-name/repo-name/edit/branch-name/subdirectory-name/
  # For example: https://github.com/jerryc127/butterfly.js.org/edit/main/source/
  url: https://github.com/koco-co/hexo-blog/edit/main/source/

# Related Articles
related_post:
  enable: true
  # Number of posts displayed
  limit: 6
  # Choose: created / updated
  date_type: created

# Choose: 1 / 2 / false
# 1: The 'next post' will link to old post
# 2: The 'next post' will link to new post
# false: disable pagination
post_pagination: 1

# 显示过时通知帖子, Displays outdated notice for a post
noticeOutdate:
  enable: false
  # Style: simple / flat
  style: flat
  # When will it be shown
  limit_day: 365
  # Position: top / bottom
  position: top
  message_prev: It has been
  message_next: 自上次更新以来, 文章内容可能已过时.

# --------------------------------------
# 页脚设置
# 说明：配置网站底部页脚信息
# --------------------------------------
footer:
  # 页脚导航链接（可选）
  nav:
  # 网站所有者信息
  owner:
    # 是否显示所有者信息
    enable: true
    # 网站创建年份
    since: 2025
  # 主题和框架版权信息
  copyright:
    # 是否显示版权信息
    enable: false
    # 是否显示版本号
    version: false
  # 自定义页脚文字（可选）
  #  custom_text: |-
  #    免责声明：本站所发布的一切软件类资源的文章仅限用于学习和研究目的，不得将上述内容用于商业或者非法用途，否则，一切后果请用户自负。
  #    您必须在下载后的 24 个小时之内，从您的电脑中彻底删除上述内容。访问和下载本站内容，说明您已同意上述条款。
  #    本站部分资源来自互联网收集，如有侵权、不妥之处，请联系站长。
  #    <p>
  #    <a target="_blank" href="https://hexo.io/"><img src="https://img.shields.io/badge/Frame-Hexo-blue?style=flat&logo=hexo" title="博客框架为Hexo"></a>&nbsp;
  #    <a target="_blank" href="https://butterfly.js.org/"><img src="https://img.shields.io/badge/Theme-Butterfly-6513df?style=flat&logo=bitdefender" title="主题采用Butterfly"></a>&nbsp;
  #    <a target="_blank" href="https://www.jsdelivr.com/"><img src="https://img.shields.io/badge/CDN-jsDelivr-5a46a4?style=flat&logo=jsdelivr" title="本站使用jsDelivr为静态资源提供CDN加速"></a>&nbsp;
  #    <a target="_blank" href="https://github.com/"><img src="https://img.shields.io/badge/Source-Github-d021d6?style=flat&logo=GitHub" title="本站项目由Gtihub托管"></a>&nbsp;
  #    <a target="_blank" href="http://creativecommons.org/licenses/by-nc-sa/4.0/"><img src="https://img.shields.io/badge/Copyright-BY--NC--SA%204.0-d42328?style=flat&logo=Claris" title="本站采用知识共享署名-非商业性使用-相同方式共享4.0国际许可协议进行许可"></a>
  #    </p>

  custom_text: |-
    <p>本站内容仅供学习与研究使用。部分资料来自互联网，如有侵权或不妥，请联系处理。</p>
    <p><a href="https://hexo.io/">Hexo</a> · <a href="https://butterfly.js.org/">Butterfly</a> · <a href="https://github.com/koco-co/hexo-blog">站点源码</a> · <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a></p>

# --------------------------------------
# 侧边栏（aside）
# 说明：控制侧边栏卡片（作者、最近文章、标签、分类、归档等）显示与限制数目。
# 常用调整：card_recent_post.limit / card_tags.limit / card_categories.limit
# --------------------------------------

aside:
  # 是否启用侧边栏
  enable: true
  # 是否默认隐藏侧边栏
  hide: false
  # 是否在右下角显示隐藏侧边栏的按钮
  button: true
  # 移动端是否显示侧边栏
  mobile: true
  # 侧边栏位置：left（左侧）/ right（右侧）
  position: left
  # 侧边栏显示内容设置
  display:
    # 是否显示归档链接
    archive: true
    # 是否显示标签链接
    tag: true
    # 是否显示分类链接
    category: true
  # 作者信息卡片
  card_author:
    # 是否显示作者信息卡片
    enable: true
    # 作者简介描述
    description: 身如柳絮随风扬 无论云泥意贯一

    # 关注按钮设置
    button:
      # 是否显示关注按钮
      enable: true
      # 按钮图标（Font Awesome图标）
      icon: fab fa-github
      # 按钮文字
      text: Follow Me
      # 按钮链接地址
      link: https://github.com/koco-co

  # 公告卡片
  card_announcement:
    enable: true
    content: 欢迎来到 Sisyphus Vale。这里记录技术实践、系统学习与日常思考。

  # 最近文章卡片
  card_recent_post:
    # 是否显示最近文章
    enable: true
    # 显示文章数量（设置为0显示所有）
    limit: 5
    # 排序方式：date（按日期）/ updated（按更新时间）
    sort: date
    # 排序顺序（可选）
    sort_order:
  # 最新评论卡片
  card_newest_comments:
    # 评论按需加载，不在侧栏主动请求第三方数据。
    enable: false
    # 排序顺序（可选）
    sort_order:
    # 显示评论数量
    limit: 6
    # 数据存储时间（单位：分钟），数据保存到localStorage
    storage: 10
    # 是否显示评论者头像
    avatar: true
  # 分类卡片
  card_categories:
    # 是否显示分类
    enable: true
    # 显示分类数量（设置为0显示所有）
    limit: 0
    # 是否展开分类：none（不展开）/ true（展开）/ false（折叠）
    expand: true
    # 排序顺序（可选）
    sort_order:
  # 标签卡片
  card_tags:
    # 是否显示标签
    enable: true
    # 显示标签数量（设置为0显示所有）
    limit: 40
    # 是否显示标签颜色
    color: false
    # 标签排序方式：random（随机）/ name（按名称）/ length（按长度）
    orderby: random
    # 排序顺序：1（升序）/ -1（降序）
    order: 1
    # 排序顺序（可选）
    sort_order:
  # 归档卡片
  card_archives:
    # 是否显示归档
    enable: true
    # 归档类型：monthly（按月）/ yearly（按年）
    type: monthly
    # 日期格式，例如：YYYY年MM月
    format: MMMM YYYY
    # 排序顺序：1（升序）/ -1（降序）
    order: -1
    # 显示归档数量（设置为0显示所有）
    limit: 8
    # 排序顺序（可选）
    sort_order:
  # 文章系列卡片
  card_post_series:
    # 是否显示文章系列
    enable: true
    # 标题是否显示系列名称
    series_title: false
    # 排序方式：title（按标题）/ date（按日期）
    orderBy: "date"
    # 排序顺序：1（升序）/ -1（降序）
    order: -1
  # 网站信息卡片
  card_webinfo:
    # 是否显示网站信息
    enable: true
    # 是否显示文章总数
    post_count: true
    # 是否显示最后更新时间
    last_push_date: true
    # 排序顺序（可选）
    sort_order:
    # 网站运行时间（发布时间与现在的差值）
    # 格式：Month/Day/Year Time 或 Year/Month/Day Time
    # 留空表示不启用此功能
    runtime_date:

# --------------------------------------
# 右下角按钮设置
# 说明：配置网站右下角的功能按钮
# --------------------------------------

# 右下角按钮距离底部的距离（默认单位：px）
rightside_bottom:

# 繁简体中文转换
translate:
  # 是否启用繁简体转换
  enable: true
  # 按钮显示的文字
  default: 繁
  # 网站默认语言：1（繁体中文）/ 2（简体中文）
  defaultEncoding: 2
  # 转换延迟时间
  translateDelay: 0
  # 简体中文时按钮显示的文字
  msgToTraditionalChinese: "繁"
  # 繁体中文时按钮显示的文字
  msgToSimplifiedChinese: "簡"

# 阅读模式（去除干扰，专注阅读）
readmode: true

# --------------------------------------
# 深色模式设置
# 说明：开启后页面会显示模式切换按钮，可选择自动跟随系统（autoChangeMode: 1）
# display_mode 控制默认展示模式（light 浅色 / dark 深色）
# --------------------------------------

darkmode:
  # 是否启用深色模式
  enable: true
  # 是否显示切换深色/浅色模式的按钮
  button: true
  # 自动切换深色/浅色模式
  # autoChangeMode: 1  根据系统设置，如果系统不支持暗黑模式，它将在晚上6点到凌晨6点之间切换暗黑模式
  # autoChangeMode: 2  在晚上6点到凌晨6点之间切换暗黑模式
  # autoChangeMode: false  不自动切换
  autoChangeMode: 1
  # 设置浅色模式的时间段（值在0-24之间，不设置则默认为6和18）
  start: 10
  end: 22

# 是否在返回顶部按钮中显示滚动百分比
rightside_scroll_percent: false

# Don't modify the following settings unless you know how they work
# Choose: readmode,translate,darkmode,hideAside,toc,chat,comment
# Don't repeat the same value
rightside_item_order:
  enable: false
  # Default: readmode,translate,darkmode,hideAside
  hide:
  # Default: toc,chat,comment
  show:

# Animation for the bottom right config button
rightside_config_animation: true

# --------------------------------------
# 全局设置, Global Settings
# --------------------------------------

anchor:
  # When you scroll, the URL will update according to header id.
  auto_update: false
  # Click the headline to scroll and update the anchor
  click_to_scroll: false

photofigcaption: false

copy:
  enable: true
  # Add the copyright information after copied content
  copyright:
    enable: false
    limit_count: 150

# Need to install the hexo-wordcount plugin
wordcount:
  enable: true
  # Display the word count of the article in post meta
  post_wordcount: true
  # Display the time to read the article in post meta
  min2read: true
  # Display the total word count of the website in aside's webinfo
  total_wordcount: true

# Busuanzi count for PV / UV in site
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# --------------------------------------
# Math
# --------------------------------------

# About the per_page
# if you set it to true, it will load mathjax/katex script in each page
# if you set it to false, it will load mathjax/katex script according to your setting (add the 'mathjax: true' or 'katex: true' in page's front-matter)
math:
  # Choose: mathjax, katex
  # Leave it empty if you don't need math
  use:
  per_page: true
  hide_scrollbar: false

  mathjax:
    # Enable the contextual menu
    enableMenu: true
    # Choose: all / ams / none, This controls whether equations are numbered and how
    tags: none

  katex:
    # Enable the copy KaTeX formula
    copy_tex: false

# 外挂标签的引入, tag-plugins-plus
# see https://akilar.top/posts/615e2dec/
tag_plugins:
  enable: true # 开关
  priority: 5 #过滤器优先权
  issues: false #issues标签依赖注入开关
  link:
    placeholder: /img/avatar.png #link_card标签默认的图标图片
  CDN:
    anima: /vendor/tag-plugins-plus/font-awesome-animation.min.css
    jquery: false # issues 关闭，不加载 jQuery
    issues: false # issues 关闭，不加载 API 脚本
    iconfont: false # 当前文章未使用 iconfont symbol 标签
    carousel: /vendor/tag-plugins-plus/carousel-touch.js
    tag_plugins_css: /vendor/tag-plugins-plus/tag-plugins.css
    # ghcard_url 暂时禁用，所有公开的 github-readme-stats API 都不稳定
    # 如需使用 ghcard，请自行部署 https://github.com/anuraghazra/github-readme-stats 到 Vercel

# --------------------------------------
# Search
# --------------------------------------

# --------------------------------------
# 站内搜索设置
# 说明：支持 algolia_search（Algolia搜索）/ local_search（本地搜索）/ docsearch（文档搜索）
# 小型博客推荐使用 local_search，预加载（preload: true）会增加首页体积但提升搜索体验
# Algolia搜索需要填写 appId/apiKey/indexName
# --------------------------------------

search:
  # 选择搜索方式：algolia_search / local_search / docsearch
  # 留空表示不使用搜索功能
  use: local_search
  # 搜索框占位符文字
  placeholder: 输入关键词...

  # Algolia Search
  algolia_search:
    # Number of search results per page
    hitsPerPage: 6

  # 本地搜索配置
  local_search:
    # 在页面加载时预加载搜索数据（提升搜索体验，但会增加首页体积）
    preload: true
    # 每篇文章显示前n个搜索结果，设置为-1显示所有结果
    top_n_per_article: 1
    # 是否将HTML字符串转义为可读格式
    unescape: true
    # 搜索结果分页设置
    pagination:
      # 是否启用分页
      enable: true
      # 每页显示的搜索结果数量
      hitsPerPage: 8
    # CDN链接（可选，留空使用默认CDN）
    # 如果留空，会使用 config.root + config.search.path
    # 建议安装 hexo-generator-search 插件并配置 search.path
    CDN:

  # Docsearch
  # https://docsearch.algolia.com/
  docsearch:
    appId:
    apiKey:
    indexName:
    option:

# --------------------------------------
# 分享系统(Share System)
# --------------------------------------

share:
  # 第三方分享组件会在文章页主动联网，隐私优先模式下关闭。
  use:

  # Share.js
  # https://github.com/overtrue/share.js
  sharejs:
    enable: false
    sites: facebook,x,wechat,weibo,qq,github,email

  # AddToAny
  # https://www.addtoany.com/
  addtoany:
    enable: false
    item: x,wechat,email,copy_link

# --------------------------------------
# 评论系统（comments）
# 说明：支持多个评论系统，请在 comments.use 填写具体系统名（如 giscus/valine/waline/gittalk 等）。
# lazyload: true 可延迟加载评论组件，提升首屏性能，但计数或即时加载可能受影响。
# --------------------------------------

comments:
  # Up to two comments system, the first will be shown as default
  # Leave it empty if you don't need comments
  # Choose: Disqus/Disqusjs/Livere/Gitalk/Valine/Waline/Utterances/Facebook Comments/Twikoo/Giscus/Remark42/Artalk
