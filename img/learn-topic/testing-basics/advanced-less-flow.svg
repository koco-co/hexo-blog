<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">LeSS 共享产品待办</title>
  <desc id="desc">多个团队围绕一个产品待办协作，在冲刺规划、开发、评审和回顾之间形成反馈。</desc>
  <rect width="1200" height="500" fill="#f7f9fc"/>
  <text x="600" y="52" font-family="Arial, sans-serif" text-anchor="middle" font-size="28" font-weight="700" fill="#20304a">共享产品待办让跨团队结果可追踪</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="165" width="210" height="150" rx="18" fill="#2563eb"/><text x="175" y="220" font-size="24" font-weight="700" fill="white">产品待办</text><text x="175" y="255" font-size="17" fill="white">共同目标、优先级</text>
    <rect x="345" y="165" width="210" height="150" rx="18" fill="#0f766e"/><text x="450" y="220" font-size="24" font-weight="700" fill="white">冲刺规划</text><text x="450" y="255" font-size="17" fill="white">按能力分工</text>
    <rect x="620" y="165" width="210" height="150" rx="18" fill="#7c3aed"/><text x="725" y="220" font-size="24" font-weight="700" fill="white">团队协作</text><text x="725" y="255" font-size="17" fill="white">集成与依赖</text>
    <rect x="895" y="165" width="235" height="150" rx="18" fill="#be123c"/><text x="1012" y="220" font-size="24" font-weight="700" fill="white">评审/回顾</text><text x="1012" y="255" font-size="17" fill="white">结果与改进回流</text>
  </g>
  <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M280 240h60"/><path d="M555 240h60"/><path d="M830 240h60"/><path d="M1012 315V405H175V315"/></g>
  <text x="600" y="455" font-family="Arial, sans-serif" text-anchor="middle" font-size="19" fill="#475569">历史对照图；实际组织方式仍要回到依赖、证据和责任边界。</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
</svg>
