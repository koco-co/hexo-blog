<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">SAFe 规模化交付边界</title>
  <desc id="desc">战略目标、价值流、团队增量和持续交付之间需要共享质量与发布证据。</desc>
  <rect width="1200" height="500" fill="#f7f9fc"/>
  <text x="600" y="52" font-family="Arial, sans-serif" text-anchor="middle" font-size="28" font-weight="700" fill="#20304a">规模化交付仍要回到共享质量证据</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="120" width="250" height="105" rx="18" fill="#2563eb"/><text x="195" y="165" font-size="23" font-weight="700" fill="white">战略目标</text><text x="195" y="198" font-size="17" fill="white">价值与约束</text>
    <rect x="365" y="120" width="250" height="105" rx="18" fill="#0f766e"/><text x="490" y="165" font-size="23" font-weight="700" fill="white">价值流</text><text x="490" y="198" font-size="17" fill="white">依赖、预算、节奏</text>
    <rect x="660" y="120" width="250" height="105" rx="18" fill="#7c3aed"/><text x="785" y="165" font-size="23" font-weight="700" fill="white">团队增量</text><text x="785" y="198" font-size="17" fill="white">功能、接口、测试</text>
    <rect x="955" y="120" width="180" height="105" rx="18" fill="#be123c"/><text x="1045" y="165" font-size="23" font-weight="700" fill="white">交付</text><text x="1045" y="198" font-size="17" fill="white">发布与反馈</text>
  </g>
  <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M320 172h40"/><path d="M615 172h40"/><path d="M910 172h40"/><path d="M1045 225V355H195V225"/></g>
  <rect x="280" y="305" width="640" height="90" rx="16" fill="#334155"/><text x="600" y="345" font-family="Arial, sans-serif" text-anchor="middle" font-size="22" font-weight="700" fill="white">共同质量、依赖和发布证据</text><text x="600" y="375" font-family="Arial, sans-serif" text-anchor="middle" font-size="16" fill="white">不是框架角色图，也不是合规证明</text>
  <text x="600" y="455" font-family="Arial, sans-serif" text-anchor="middle" font-size="19" fill="#475569">历史背景图只帮助讨论规模化边界，实际责任以项目约定为准。</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
</svg>
